name: Bug report
description: Report a parsing or modelling issue with an .xosc file
labels: [bug]
body:
  - type: textarea
    id: what_happened
    attributes:
      label: What happened and what you expected
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: xosc_snippet
    attributes:
      label: The .xosc snippet that reproduces this
      description: Trim it to the smallest document that reproduces the issue.
      render: xml
    validations:
      required: true
  - type: input
    id: schema_element
    attributes:
      label: Which OpenSCENARIO element or attribute is involved?
      description: The crate targets OpenSCENARIO 1.3. See Schema/OpenSCENARIO.xsd for element definitions.
    validations:
      required: true
  - type: input
    id: crate_version
    attributes:
      label: Crate version
      placeholder: "0.4.2"
    validations:
      required: true
  - type: input
    id: rustc_version
    attributes:
      label: rustc --version
      placeholder: "rustc 1.70.0"
    validations:
      required: true
  - type: dropdown
    id: features
    attributes:
      label: Which features were enabled?
      multiple: true
      options:
        - "None (default)"
        - "builder"
        - "validation"
        - "builder and validation"
    validations:
      required: true
