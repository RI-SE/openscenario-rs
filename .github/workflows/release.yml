name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag matches Cargo.toml version
        run: |
          set -euo pipefail
          cargo_version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$cargo_version" != "$tag_version" ]]; then
            echo "release.yml: tag ${GITHUB_REF_NAME} (version ${tag_version}) does not match Cargo.toml version ${cargo_version}" >&2
            exit 1
          fi
          echo "version=${cargo_version}" >> "$GITHUB_ENV"

      - name: Check CHANGELOG has a section for this version
        run: |
          set -euo pipefail
          if ! grep -qE "^## \[${version}\]" CHANGELOG.md; then
            echo "release.yml: CHANGELOG.md has no '## [${version}]' heading" >&2
            exit 1
          fi

      - run: sudo apt-get update && sudo apt-get install -y libxml2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: conformance/corpus/
          key: corpus-${{ hashFiles('scripts/fetch-corpus.sh') }}
      - run: bash scripts/gate.sh

      - name: Slice release notes from CHANGELOG
        run: |
          set -euo pipefail
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "release.yml: sliced release notes for ${version} are empty" >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prerelease_flag=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "v${version}" \
            --notes-file release-notes.md \
            "${prerelease_flag[@]}"
