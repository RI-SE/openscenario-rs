[package]
name = "openscenario-roundtrip-harness"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
openscenario-rs = { path = "..", features = ["builder", "validation"] }
quick-xml = "0.38"
serde = { version = "1.0", features = ["derive"] }
toml = { version = "0.8", features = ["parse"] }
walkdir = "2"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = { version = "0.8", features = ["parse"] }
walkdir = "2"
